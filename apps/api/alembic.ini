[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..:%(here)s/../../packages
# DB URL is read from the DATABASE_URL env var in env.py (keep this file ASCII: Windows reads it as cp949)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
