app:
  description: 도구를 쓰는 에이전트
  icon: 🕵️
  icon_background: '#FFEAD5'
  mode: agent-chat
  name: 리서치 에이전트
kind: app
version: 0.1.5
model_config:
  agent_mode:
    enabled: true
    max_iteration: 6
    strategy: function_call
    tools:
    - enabled: true
      isDeleted: false
      notAuthor: false
      provider_id: google
      provider_name: google
      provider_type: builtin
      tool_label: Google Search
      tool_name: google_search
      tool_parameters:
        query: ''
    - dataset:
        enabled: true
        id: 4f0f6b0a-1111-4222-8333-444455556666
  annotation_reply:
    enabled: false
  dataset_configs:
    datasets:
      datasets: []
    retrieval_model: single
  file_upload:
    enabled: false
  model:
    completion_params:
      temperature: 0.3
    mode: chat
    name: gpt-4o
    provider: openai
  opening_statement: 무엇을 조사해 드릴까요?
  pre_prompt: 사용자의 질문을 검색 도구와 지식으로 조사해서 근거와 함께 답하세요.
  prompt_type: simple
  retriever_resource:
    enabled: true
  sensitive_word_avoidance:
    enabled: false
  speech_to_text:
    enabled: false
  suggested_questions: []
  suggested_questions_after_answer:
    enabled: true
  text_to_speech:
    enabled: false
  user_input_form: []
