app:
  description: 사내 규정을 친절하게 설명하는 챗봇
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: 사내 도우미
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables:
  - description: ''
    id: 6a7b0a2e-3a43-4b5a-9d63-1f8d2c3a9e11
    name: visit_count
    selector:
    - conversation
    - visit_count
    value: 0
    value_type: number
  environment_variables:
  - description: ''
    id: 0c1f2d3e-4b5a-4c6d-8e7f-9a0b1c2d3e4f
    name: COMPANY
    selector:
    - env
    - COMPANY
    value: 효성
    value_type: string
  - description: ''
    id: 1d2e3f40-5c6b-4d7e-9f80-a1b2c3d4e5f6
    name: SECRET_TOKEN
    selector:
    - env
    - SECRET_TOKEN
    value: super-secret-value
    value_type: secret
  features:
    file_upload:
      enabled: false
    opening_statement: 안녕하세요! 사내 규정에 대해 물어보세요.
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: true
      type: keywords
      config:
        keywords: |-
          욕설
          비속어
        inputs_config:
          enabled: true
          preset_response: 그 내용에는 답할 수 없어요.
        outputs_config:
          enabled: false
          preset_response: ''
    speech_to_text:
      enabled: true
    suggested_questions:
    - 연차는 며칠인가요?
    - 재택근무 규정은?
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: llm
      id: 1711528708197-source-1711528709999-target
      source: '1711528708197'
      sourceHandle: source
      target: '1711528709999'
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        sourceType: llm
        targetType: answer
      id: 1711528709999-source-1711528710555-target
      source: '1711528709999'
      sourceHandle: source
      target: '1711528710555'
      targetHandle: target
      type: custom
    nodes:
    - data:
        desc: ''
        selected: false
        title: 시작
        type: start
        variables: []
      height: 54
      id: '1711528708197'
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: ''
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 10
        model:
          completion_params:
            temperature: 0.7
          mode: chat
          name: gpt-4o
          provider: openai
        prompt_template:
        - id: 7a1b2c3d-0000-4000-8000-000000000001
          role: system
          text: 당신은 {{#env.COMPANY#}}의 사내 규정 도우미입니다. 친절하고 짧게 답하세요.
        selected: false
        title: AI 답변
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: '1711528709999'
      position:
        x: 380
