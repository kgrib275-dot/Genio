<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 글꼴은 화면 그리기를 막지 않게 늦게 적용한다(그 전엔 시스템 글꼴). 적용은 /boot.js -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      id="font-css"
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      media="print"
    />
    <title>제니오 Genio — 말로 만드는 나만의 앱</title>
    <meta
      name="description"
      content="말로 요청하면 일하는 앱이 만들어져요. 챗봇·자동화·사람 승인까지 코딩 없이 한 곳에서."
    />
    <!-- 링크 미리보기: 메신저 로봇은 서버가 따로 내주는 HTML(/api/v1/public/share/)을 읽는다. 여기는 보조 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="제니오" />
    <meta property="og:title" content="제니오 — 말로 만드는 나만의 앱" />
    <meta
      property="og:description"
      content="말로 요청하면 일하는 앱이 만들어져요. 챗봇·자동화·사람 승인까지 코딩 없이 한 곳에서."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- 테마·글자 크기를 먼저 적용(인라인 스크립트는 보안 정책으로 막으므로 파일로) -->
    <script src="/boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
