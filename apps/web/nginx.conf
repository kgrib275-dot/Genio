# 공유 챗(/share/...)은 다른 웹사이트의 위젯(iframe) 안에 들어가므로 액자 막기에서 뺀다.
map $request_uri $genio_frame_options {
    ~^/share/ "";
    default   "SAMEORIGIN";
}

# 콘텐츠 보안 정책(CSP): 우리 서버의 스크립트만 실행(인라인 스크립트 금지 → 테마는 /boot.js),
# 글꼴 CSS·파일은 jsdelivr, 이미지는 https·data·blob(답변 속 그림·사진 미리 보기), API·SSE는 같은 주소.
# 액자(iframe)로 넣는 것은 공유 챗(/share/)만 모든 사이트에 허용하고 나머지는 같은 주소만.
map $request_uri $genio_frame_ancestors {
    ~^/share/ "*";
    default   "'self'";
}

# 링크 미리보기(카카오톡·슬랙·페이스북·네이버 등 메신저 로봇): 로봇은 자바스크립트를 실행하지 않으므로
# 화면(SPA) 대신 서버가 제목·소개·썸네일(Open Graph)을 넣어 만든 HTML(/api/v1/public/share/)을 준다.
# 사람(브라우저)은 그대로 화면을 받는다. 공유 링크가 아닌 첫 화면·로그인 화면은 일반 소개('-')를 준다.
map $http_user_agent $genio_bot {
    default 0;
    "~*(kakaotalk|facebookexternalhit|facebot|twitterbot|slackbot|discordbot|linkedinbot|telegrambot|whatsapp|skypeuripreview|microsoft teams|mattermost|embedly|pinterest|naverbot|yeti|bandapp|googlebot|bingbot)" 1;
}
map $request_uri $genio_preview_token {
    default "";
    "~^/share/(?<tok>[A-Za-z0-9_-]+)" $tok;
    "~^/(login|signup|terms|privacy)?/?(\?.*)?$" "-";
}
map "$genio_bot$genio_preview_token" $genio_preview {
    default 0;
    "~^1." 1;
}

server {
    listen 5190;
    server_name _;
    root /usr/share/nginx/html;
    # nginx 버전을 응답 헤더에 드러내지 않는다
    server_tokens off;

    # 압축(텍스트 자원)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 보안 헤더(부하 시험 보고서 §4). location에서 add_header를 쓰면 위 값이 이어지지 않아
    # 각 location에 같은 줄을 둔다. HSTS는 https(공개 주소)에서만 브라우저가 따른다.

    # 빌드 산출물은 파일 이름에 해시가 붙어 있어 1년 캐시
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # API·SSE는 api 컨테이너로. SSE가 끊기지 않게 버퍼링을 끄고 오래 기다린다.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        client_max_body_size 25m;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location = /health {
        proxy_pass http://api:8000;
    }

    # 메신저 로봇에게 주는 미리보기 HTML(위 map 참고). 5분 캐시.
    error_page 418 = @share_preview;
    location @share_preview {
        rewrite ^ /api/v1/public/share/$genio_preview_token break;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # 화면 주소는 모두 index.html(SPA). index.html은 캐시하지 않아 배포 즉시 반영된다.
    location / {
        if ($genio_preview) {
            return 418;
        }
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy "camera=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors $genio_frame_ancestors" always;
        add_header X-Frame-Options $genio_frame_options always;
        try_files $uri /index.html;
    }
}
