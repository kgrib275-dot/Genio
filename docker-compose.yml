# 포트(이 PC에서 쓰지 않는 번호로 고름, 모두 127.0.0.1에만 열어 LAN에 노출하지 않음)
#   web 5190 · api 8190 · postgres 55432 · redis 56379
# 외부 공유는 Tailscale serve가 127.0.0.1:5190으로 넘겨 준다(docs/runbook.md).
x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-genio}:${POSTGRES_PASSWORD:-genio}@postgres:5432/${POSTGRES_DB:-genio}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  PYTHONPATH: /app/apps:/app/packages
  MARKET_ITEMS_DIR: /app/market-items

x-backend-common: &backend-common
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  env_file:
    - path: .env
      required: false
  environment: *backend-env
  volumes:
    - ./apps/api:/app/apps/api
    - ./apps/worker:/app/apps/worker
    - ./packages:/app/packages
    - ./market-items:/app/market-items
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-genio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genio}
      POSTGRES_DB: ${POSTGRES_DB:-genio}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-genio} -d ${POSTGRES_DB:-genio}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend-common
    command: >
      sh -c "alembic -c apps/api/alembic.ini upgrade head &&
             uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/apps/api --reload-dir /app/packages"
    ports:
      - "127.0.0.1:8190:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30

  worker:
    <<: *backend-common
    command: celery -A worker.celery_app:celery worker --loglevel=INFO --concurrency=4
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    environment:
      VITE_API_PROXY: http://api:8000
      VITE_USE_POLLING: "1"
    ports:
      - "127.0.0.1:5190:5190"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  web_node_modules:
