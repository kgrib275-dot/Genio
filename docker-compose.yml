# 포트(이 PC에서 쓰지 않는 번호로 고름, 모두 127.0.0.1에만 열어 LAN에 노출하지 않음)
#   web 5190 · api 8190 · postgres 55432 · redis 56379
# 외부 공유는 Tailscale serve가 127.0.0.1:5190으로 넘겨 준다(docs/runbook.md).
x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-genio}:${POSTGRES_PASSWORD:-genio}@postgres:5432/${POSTGRES_DB:-genio}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  PYTHONPATH: /app/apps:/app/packages
  MARKET_ITEMS_DIR: /app/market-items
  # Docker Desktop(Windows) 바인드 마운트는 변경 알림이 없어서 자동 재시작을 폴링으로 감시
  WATCHFILES_FORCE_POLLING: "true"

x-backend-common: &backend-common
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  env_file:
    - path: .env
      required: false
  environment: *backend-env
  volumes:
    - ./apps/api:/app/apps/api
    - ./apps/worker:/app/apps/worker
    - ./packages:/app/packages
    - ./market-items:/app/market-items
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-genio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genio}
      POSTGRES_DB: ${POSTGRES_DB:-genio}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-genio} -d ${POSTGRES_DB:-genio}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend-common
    command: >
      sh -c "alembic -c apps/api/alembic.ini upgrade head &&
             uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/apps/api --reload-dir /app/packages"
    ports:
      - "127.0.0.1:8190:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30

  worker:
    <<: *backend-common
    command: celery -A worker.celery_app:celery worker --loglevel=INFO --concurrency=4
    depends_on:
      api:
        condition: service_healthy

  web:
    # 배포용 빌드를 nginx로 서빙(빠른 첫 화면). 개발 중 바로 반영하려면 apps/web에서 npm run dev(5190, API 8190 프록시).
    build:
      context: apps/web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5190:5190"
    depends_on:
      - api
    restart: unless-stopped

  # Tailscale에 "genio"라는 기기로 올려 https://genio.<tailnet>.ts.net 주소로 공유(ADR 0004)
  # 처음 한 번: docker compose logs tailscale 에 나오는 로그인 링크로 승인하거나 .env에 TS_AUTHKEY를 둔다.
  tailscale:
    image: tailscale/tailscale:v1.80.3
    # web 컨테이너와 네트워크를 같이 써서 localhost:5190으로 웹을 본다(serve는 localhost만 지원)
    network_mode: service:web
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
    # 기본 시작 스크립트는 로그인을 60초만 기다리고 재시작해 승인 링크가 계속 바뀐다.
    # 그래서 직접 띄우고, 승인될 때까지 기다린 뒤 HTTPS(443) → 127.0.0.1:5190(web)으로 넘긴다.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        tailscaled --tun=userspace-networking --statedir=/var/lib/tailscale &
        sleep 2
        tailscale up --hostname=genio ${TS_AUTHKEY:+--auth-key=$$TS_AUTHKEY} --timeout=0
        tailscale serve --bg --https=443 http://127.0.0.1:5190
        wait
    volumes:
      - tsstate:/var/lib/tailscale
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  tsstate:
