# 포트(이 PC에서 쓰지 않는 번호로 고름, 모두 127.0.0.1에만 열어 LAN에 노출하지 않음)
#   web 5190 · api 8190 · postgres 55432 · redis 56379
# 외부 공유는 Tailscale serve가 127.0.0.1:5190으로 넘겨 준다(docs/runbook.md).
x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-genio}:${POSTGRES_PASSWORD:-genio}@postgres:5432/${POSTGRES_DB:-genio}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  PYTHONPATH: /app/apps:/app/packages
  MARKET_ITEMS_DIR: /app/market-items
  # Docker Desktop(Windows) 바인드 마운트는 변경 알림이 없어서 자동 재시작을 폴링으로 감시
  WATCHFILES_FORCE_POLLING: "true"
  # 관리 > 시스템 상태에 보일 버전. 올릴 때: GENIO_VERSION=<커밋 짧은 해시> docker compose up -d
  GENIO_VERSION: ${GENIO_VERSION:-dev}
  GENIO_BACKUP_DIR: /backups

x-backend-common: &backend-common
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  env_file:
    - path: .env
      required: false
  environment: *backend-env
  volumes:
    - ./apps/api:/app/apps/api
    - ./apps/worker:/app/apps/worker
    - ./packages:/app/packages
    - ./market-items:/app/market-items
    # 자동 백업 결과(status.json)를 읽기만 한다
    - ./backups:/backups:ro
    # v0.8 GENIO_STORAGE=disk 일 때 파일이 쌓이는 곳(기본 db 모드에서는 비어 있다)
    - filestore:/data/files
    # v0.8 파일 옮기기 도구(scripts/migrate_files_to_storage.py)
    - ./scripts:/app/scripts:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  # sandbox_net: 코드 실행 서버(profile sandbox)와만 이어지는 내부망. default는 지금처럼 DB·Redis·인터넷용
  networks:
    - default
    - sandbox_net
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    # API 프로세스(기본 4) x 연결 20 + 워커. 기본 100은 부족할 수 있다.
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-genio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genio}
      POSTGRES_DB: ${POSTGRES_DB:-genio}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-genio} -d ${POSTGRES_DB:-genio}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend-common
    command: >
      sh -c "alembic -c apps/api/alembic.ini upgrade head &&
             exec uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers $${GENIO_API_WORKERS:-4} --timeout-keep-alive 30"
    ports:
      - "127.0.0.1:8190:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30

  worker:
    <<: *backend-common
    command: celery -A worker.celery_app:celery worker -B --schedule /tmp/celerybeat-schedule --loglevel=INFO --concurrency=4
    depends_on:
      api:
        condition: service_healthy

  # DB 자동 백업: 매일 GENIO_BACKUP_HOUR시(기본 3시, 서울 시간) pg_dump → ./backups, 7일 보관.
  # 포트를 열지 않는다. 복구: bash scripts/restore_backup.sh backups/<파일> (docs/runbook.md)
  backup:
    image: pgvector/pgvector:pg16
    entrypoint: ["bash", "/scripts/backup_loop.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-genio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genio}
      POSTGRES_DB: ${POSTGRES_DB:-genio}
      PGHOST: postgres
      TZ: ${GENIO_BACKUP_TZ:-Asia/Seoul}
      GENIO_BACKUP_HOUR: ${GENIO_BACKUP_HOUR:-3}
      GENIO_BACKUP_KEEP_DAYS: ${GENIO_BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./backups:/backups
      - ./scripts/backup_loop.sh:/scripts/backup_loop.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # v0.8 코드 실행 격리 서버(선택, profile: sandbox). 켜는 법: docs/runbook.md "v0.8 운영 안전"
  #   .env에 GENIO_SANDBOX_KEY=<긴 무작위 문자열>, GENIO_SANDBOX_URL=http://sandbox:9100 를 넣고
  #   COMPOSE_PROFILES=sandbox docker compose up -d --build 로 올린다. 비워 두면 지금처럼 서버 안에서 실행한다.
  # 외부로 나가는 길이 없는 내부망(sandbox_net)에만 두고, DB·Redis·AI 키에는 접근하지 못한다.
  sandbox:
    profiles: ["sandbox"]
    build:
      context: .
      dockerfile: apps/sandbox/Dockerfile
    environment:
      GENIO_SANDBOX_KEY: ${GENIO_SANDBOX_KEY:-}
      SANDBOX_MEMORY_MB: ${SANDBOX_MEMORY_MB:-512}
      SANDBOX_MAX_CONCURRENT: ${SANDBOX_MAX_CONCURRENT:-4}
    networks:
      - sandbox_net
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9100/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # v0.8 파일 저장용 S3 호환 서버(선택, profile: storage). MinIO 공식 이미지가 더는 배포되지 않아
  # RustFS(S3 호환, Apache-2.0)를 쓴다. 이미 쓰는 S3(AWS 등)가 있으면 이 서비스는 필요 없다.
  #   .env: GENIO_STORAGE=s3, GENIO_S3_ENDPOINT_URL=http://objectstore:9000, GENIO_S3_BUCKET=genio,
  #         GENIO_S3_ACCESS_KEY=..., GENIO_S3_SECRET_KEY=..., GENIO_S3_PATH_STYLE=true
  #   COMPOSE_PROFILES=storage docker compose up -d  → 버킷 만들기와 옮기기는 docs/runbook.md 참고
  objectstore-init:
    profiles: ["storage"]
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /data/d0 && chown -R 10001:10001 /data"]
    volumes:
      - objectdata:/data
    restart: "no"

  objectstore:
    profiles: ["storage"]
    image: rustfs/rustfs:latest
    environment:
      # 비워 두면 RustFS가 시작을 거부한다(기본 비밀번호로 뜨지 않음). 꼭 .env에 정해 준다.
      RUSTFS_ACCESS_KEY: ${GENIO_S3_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${GENIO_S3_SECRET_KEY:-}
      RUSTFS_VOLUMES: /data/d0
      RUSTFS_ADDRESS: ":9000"
    volumes:
      - objectdata:/data
    # S3 주소(9000)는 컴포즈 내부망에서만 쓴다. 관리 화면(9001)만 이 PC에서 본다.
    ports:
      - "127.0.0.1:59001:9001"
    depends_on:
      objectstore-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    # 배포용 빌드를 nginx로 서빙(빠른 첫 화면). 개발 중 바로 반영하려면 apps/web에서 npm run dev(5190, API 8190 프록시).
    build:
      context: apps/web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5190:5190"
    depends_on:
      - api
    restart: unless-stopped

  # Tailscale에 "genio"라는 기기로 올려 https://genio.<tailnet>.ts.net 주소로 공유(ADR 0004)
  # 처음 한 번: docker compose logs tailscale 에 나오는 로그인 링크로 승인하거나 .env에 TS_AUTHKEY를 둔다.
  tailscale:
    image: tailscale/tailscale:v1.80.3
    # web 컨테이너와 네트워크를 같이 써서 localhost:5190으로 웹을 본다(serve는 localhost만 지원)
    network_mode: service:web
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
    # 기본 시작 스크립트는 로그인을 60초만 기다리고 재시작해 승인 링크가 계속 바뀐다.
    # 그래서 직접 띄우고, 승인될 때까지 기다린 뒤 HTTPS(443) → 127.0.0.1:5190(web)으로 넘긴다.
    # Funnel: tailnet 밖(핸드폰 등 인터넷)에서도 열린다. 끄려면 funnel 대신 serve로 바꾼다.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        tailscaled --tun=userspace-networking --statedir=/var/lib/tailscale &
        sleep 2
        tailscale up --hostname=genio ${TS_AUTHKEY:+--auth-key=$$TS_AUTHKEY} --timeout=0
        tailscale funnel --bg http://127.0.0.1:5190
        wait
    volumes:
      - tsstate:/var/lib/tailscale
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  tsstate:
  filestore:
  objectdata:

networks:
  # 외부로 나가는 길이 없는 내부망(internal): 코드 실행 서버는 여기에만 둔다
  sandbox_net:
    internal: true
